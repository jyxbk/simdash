<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SimDash</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="viz-root" data-palette="#3987e5">
  <header class="topbar">
    <a class="brand" href="/" aria-label="SimDash Startseite">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>Sim<b>Dash</b></span>
    </a>
    <span id="status" class="status" aria-live="polite"></span>
  </header>

  <nav class="filters" aria-label="Filter">
    <div id="game-chips" class="chips" role="group" aria-label="Spiel"></div>
    <div class="selects">
      <select id="f-track" aria-label="Strecke"><option value="">Alle Strecken</option></select>
      <select id="f-car" aria-label="Auto"><option value="">Alle Autos</option></select>
    </div>
  </nav>

  <main>
    <section id="hero" class="hero" aria-label="Neueste Bestzeit"></section>

    <section class="tiles" id="tiles" aria-label="Kennzahlen"></section>

    <section aria-labelledby="h-bests">
      <div class="section-head">
        <h2 id="h-bests">Bestzeiten</h2>
        <span class="hint">Tippen für Details</span>
      </div>
      <div id="bests" class="cards"></div>
    </section>

    <section id="detail" class="detail" hidden aria-labelledby="h-detail">
      <div class="section-head">
        <h2 id="h-detail">Rundenzeiten</h2>
        <button id="detail-close" class="ghost" type="button" aria-label="Details schließen">✕</button>
      </div>
      <div class="detail-card">
        <div id="detail-title" class="detail-title"></div>
        <div class="legend" id="detail-legend"></div>
        <div id="chart" class="chart" role="img"></div>
        <details class="table-view">
          <summary>Tabelle anzeigen</summary>
          <div id="detail-table"></div>
        </details>
      </div>
    </section>

    <section aria-labelledby="h-sessions">
      <div class="section-head">
        <h2 id="h-sessions">Letzte Sessions</h2>
      </div>
      <div id="sessions"></div>
    </section>
  </main>

  <footer>
    <a href="/static/simdash-collector.zip">Collector für Windows herunterladen</a>
    <span>·</span>
    <span>AC EVO · iRacing · ACC · AC Rally · Assetto Corsa</span>
  </footer>

  <div id="tooltip" class="tooltip" role="status" hidden></div>

  <template id="tpl-empty">
    <div class="empty">
      <img src="/static/icon.svg" alt="" width="40" height="40">
      <p>Noch keine Runden. Starte den Collector auf dem Gaming-PC und fahr los.</p>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
